name: love_movie_app
description: "A new Flutter project."
# A linha a seguir evita que o pacote seja publicado acidentalmente no
# pub.dev usando `flutter pub publish`. Isso é preferível para pacotes privados.
publish_to: 'none' # Remova esta linha se você quiser publicar no pub.dev

# A seção a seguir define a versão e o número de build do seu aplicativo.
# Um número de versão é composto por três números separados por pontos, como 1.2.43,
# seguido por um número de build opcional separado por +.
# Tanto a versão quanto o número de build podem ser sobrescritos em flutter
# build especificando --build-name e --build-number, respectivamente.
# No Android, build-name é usado como versionName enquanto build-number é usado como versionCode.
# Leia mais sobre versionamento do Android em https://developer.android.com/studio/publish/versioning
# No iOS, build-name é usado como CFBundleShortVersionString enquanto build-number é usado como CFBundleVersion.
# Leia mais sobre versionamento do iOS em
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# No Windows, build-name é usado como as partes de maior, menor e correção
# das versões do produto e do arquivo, enquanto build-number é usado como sufixo do build.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# As dependências especificam outros pacotes de que o seu pacote precisa para funcionar.
# Para atualizar automaticamente as dependências do seu pacote para as versões mais recentes,
# considere executar `flutter pub upgrade --major-versions`. Alternativamente,
# as dependências podem ser atualizadas manualmente alterando os números de versão abaixo para
# a versão mais recente disponível no pub.dev. Para ver quais dependências têm versões mais recentes,
# execute `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # O pacote "intl" é usado para internacionalização e formatação de datas, 
  # números e mensagens.
  intl: any
  
  http: ^1.2.2

  # A linha a seguir adiciona a fonte Cupertino Icons ao seu aplicativo.
  # Use-a com a classe CupertinoIcons para ícones no estilo iOS.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # O pacote "flutter_lints" abaixo contém um conjunto de regras recomendadas para
  # incentivar boas práticas de codificação. O conjunto de regras fornecido pelo pacote é
  # ativado no arquivo `analysis_options.yaml` localizado na raiz do seu
  # pacote. Consulte esse arquivo para obter informações sobre como desativar regras específicas
  # de lint e ativar outras.
  flutter_lints: ^6.0.0

# Para obter informações sobre a parte genérica do Dart neste arquivo, consulte a
# página a seguir: https://dart.dev/tools/pub/pubspec

# A seção a seguir é específica para pacotes Flutter.
flutter:

  # A linha a seguir garante que a fonte Material Icons seja
  # incluída no seu aplicativo, para que você possa usar os ícones na
  # classe Material Icons.
  uses-material-design: true

  # indica ao Flutter para gerar automaticamente  arquivos de código 
  # relacionados a assets e fontes, facilitando o uso desses recursos no 
  # aplicativo.
  generate: true

  # Para adicionar assets ao seu aplicativo, adicione uma seção assets, assim:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # Um asset de imagem pode se referir a uma ou mais "variantes" específicas da resolução; consulte
  # https://flutter.dev/to/resolution-aware-images

  # Para obter detalhes sobre a adição de assets de dependências de pacotes, consulte
  # https://flutter.dev/to/asset-from-package

  # Para adicionar fontes personalizadas ao seu aplicativo, adicione uma seção fonts aqui,
  # nesta seção "flutter". Cada entrada desta lista deve ter uma chave
  # "family" com o nome da família da fonte e uma chave "fonts" com uma
  # lista fornecendo o asset e outros descritores para a fonte. Por exemplo:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # Para obter detalhes sobre fontes de dependências de pacotes,
  # consulte https://flutter.dev/to/font-from-package
